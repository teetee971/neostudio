
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NEOSTUDIO AI</title>
  <style>
    body { background: #0f0f0f; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; }
    header { padding: 2rem; text-align: center; background: #1c1c1c; }
    h1 { margin: 0; font-size: 2.8rem; }
    .carrousel, .galerie, .generateur, .chat { margin: 2rem auto; max-width: 960px; padding: 1rem; background: #1a1a1a; border-radius: 12px; }
    .carrousel img { width: 100%; border-radius: 12px; }
    .galerie img, .galerie video, .galerie audio { max-width: 100%; margin: 0.5rem 0; border-radius: 8px; }
    .generateur textarea { width: 100%; height: 80px; border-radius: 6px; border: none; padding: 1rem; font-size: 1rem; }
    .generateur button { padding: 1rem 2rem; margin-top: 1rem; font-size: 1rem; background: #00bcd4; border: none; border-radius: 6px; cursor: pointer; }
    #chat-widget { position: fixed; bottom: 20px; right: 20px; width: 300px; height: 400px; background: #222; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.7); display: flex; flex-direction: column; }
    #chat-widget header { background: #00bcd4; padding: 0.5rem; color: black; text-align: center; font-weight: bold; }
    #chat-messages { flex: 1; padding: 1rem; overflow-y: auto; }
    #chat-input { display: flex; border-top: 1px solid #333; }
    #chat-input input { flex: 1; padding: 0.5rem; border: none; background: #111; color: white; }
    #chat-input button { padding: 0.5rem 1rem; background: #00bcd4; border: none; cursor: pointer; }
  </style>
</head>
<body>

<header>
  <h1>NEOSTUDIO AI</h1>
  <p>Générateur IA multimédia (images, vidéos, voix, texte)</p>
</header>

<section class="carrousel">
  <h2>🎠 Top 1 du Mois</h2>
  <img src="https://placehold.co/960x320?text=Vidéo+du+Mois" alt="Top 1">
</section>

<section class="generateur">
  <h2>🧠 Générateur IA</h2>
  <textarea placeholder="Décris ce que tu veux générer..."></textarea>
  <button onclick="alert('Génération IA lancée !')">Générer</button>
</section>

<section class="galerie">
  <h2>🎨 Galerie IA</h2>
  <p>Images générées :</p>
  <img src="https://placehold.co/600x300?text=Image+IA">
  <p>Vidéos générées :</p>
  <video controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
  <p>Voix générées :</p>
  <audio controls src="https://www.w3schools.com/html/horse.mp3"></audio>
</section>

<div id="chat-widget">
  <header>💬 GPT-4 Chat</header>
  <div id="chat-messages"><p>Bonjour ! Pose-moi une question.</p></div>
  <div id="chat-input">
    <input type="text" placeholder="Votre message..."/>
    <button onclick="alert('Message envoyé à GPT-4')">➤</button>
  </div>
</div>

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.5.2/firebase-analytics.js";

    apiKey: "AIzaSyDF9kz5oz4JaEMsGiplnmuQ2Yt2qD567X8",

    projectId: "neostudio-834fa",
    storageBucket: "neostudio-834fa.firebasestorage.app",
    messagingSenderId: "957529530912",
    appId: "1:957529530912:web:199234052a7333c800d245",
    measurementId: "G-9XNT09JB00"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
</script>

</body>
</html>
