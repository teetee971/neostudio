
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeoStudio Galerie IA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="glass-header">
    <h1>Galerie Immersive IA</h1>
    <nav>
      <ul>
        <li><a href="#">Accueil</a></li>
        <li><a href="#">Galerie</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main class="gallery-container">
    <section class="filters">
      <button>🖼️ Images</button>
      <button>🎥 Vidéos</button>
      <button>🎙️ Voix</button>
      <button>📄 Textes</button>

    <section class="gallery">
      <!-- Exemple de carte média -->
      <div class="media-card">
        <img src="sample.jpg" alt="media IA" />
        <div class="media-info">
          <h3>Image IA Générée</h3>
        </div>
      </div>
    </section>
  </main>

</html>
