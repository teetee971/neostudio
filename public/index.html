<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeoStudio - IA Multimédia</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #0d0d0d; color: white; }
    header { padding: 1rem; text-align: center; background: #1e1e1e; }
    select, input, button { margin: 0.5rem; padding: 0.5rem; border-radius: 10px; border: none; }
    #model-select { background: #222; color: white; }
    #gallery { display: flex; flex-wrap: wrap; gap: 1rem; padding: 1rem; justify-content: center; }
    .media-card { background: #181818; padding: 1rem; border-radius: 12px; width: 220px; }
    .media-card img, .media-card video { max-width: 100%; border-radius: 8px; }
    .tag { font-size: 0.75rem; color: #aaa; }
  </style>
</head>
<body>
  <header>
    <h1>🎨 Galerie IA & Générateur</h1>
    <label for="model-select">Modèle IA :</label>
    <select id="model-select">
      <option value="gpt-4">GPT-4 Turbo</option>
      <option value="gemini">Gemini Pro</option>
      <option value="claude">Claude 3</option>
    </select>
    <input type="text" id="prompt-input" placeholder="Décris ce que tu veux..."/>
    <button onclick="sendPrompt()">Envoyer</button>
  </header>

  <section id="gallery">
    <!-- Les médias Firestore apparaîtront ici -->
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_KEY",
      authDomain: "neostudio-834fa.firebaseapp.com",
      projectId: "neostudio-834fa",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadGallery() {
      const snap = await getDocs(collection(db, "galerie"));
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = '';
      snap.forEach(doc => {
        const data = doc.data();
        const card = document.createElement("div");
        card.className = "media-card";
        if (data.type === "image") {
          card.innerHTML = `<img src="${data.url}" alt="${data.label}" /><p>${data.label}</p><div class="tag">🖼️ Image</div>`;
        } else if (data.type === "video") {
          card.innerHTML = `<video src="${data.url}" controls></video><p>${data.label}</p><div class="tag">🎥 Vidéo</div>`;
        } else if (data.type === "voice") {
          card.innerHTML = `<audio controls src="${data.url}"></audio><p>${data.label}</p><div class="tag">🎙️ Voix</div>`;
        } else {
          card.innerHTML = `<p>${data.label}</p><div class="tag">📝 Texte IA</div>`;
        }
        gallery.appendChild(card);
      });
    }

    loadGallery();

    async function sendPrompt() {
      const model = document.getElementById("model-select").value;
      const prompt = document.getElementById("prompt-input").value;
      if (!prompt) return alert("⚠️ Entrez un prompt.");
      const endpoint = model === "gpt-4" ? "generateText"
                    : model === "gemini" ? "gemini"
                    : "generateText"; // fallback pour Claude
      const res = await fetch(`https://us-central1-neostudio-834fa.cloudfunctions.net/${endpoint}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json();
      alert("Réponse IA :\n" + (data.text || data.response || "OK"));
    }
  </script>
</body>
</html>
