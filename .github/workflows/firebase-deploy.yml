name: 🚀 Deploy to Firebase Hosting (CI)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v3

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🔐 Authenticate with Firebase (via token)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy --only hosting --project neostudio-834fa --token "$FIREBASE_TOKEN"